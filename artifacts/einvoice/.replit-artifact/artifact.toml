kind = "web"
previewPath = "/"
title = "FIRS E-Invoicing Platform"
version = "1.0.0"
id = "artifacts/einvoice"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 18550

[services.development]
run = "pnpm --filter @workspace/einvoice run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/einvoice", "run", "build" ]
publicDir = "artifacts/einvoice/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18550"
BASE_PATH = "/"
